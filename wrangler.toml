name = "lawflow"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# Required production secrets / variables (configure in Cloudflare; never commit values):
# GEMINI_API_KEY     = Gemini API Key（required for the current PDF pipeline）
# GEMINI_MODEL       = gemini-3.8-flash（optional; this is the code default）
# DASHSCOPE_API_KEY  = Qwen API Key（required for full-page verbatim extraction）
# QWEN_MODEL         = qwen3.8-flash（optional）
# LAWFLOW_ALLOWED_ORIGIN = https://your-production-domain.example（recommended）
# LAWFLOW_REQUIRE_ACCESS = true（recommended; requires a Cloudflare Access policy）

# Cloudflare D1 Database Binding (Optional for cloud sync)
# [[d1_databases]]
# binding = "DB"
# database_name = "lawflow_db"
# database_id = "your-d1-database-id"

# Cloudflare R2 Bucket Binding (Optional for cloud documents storage)
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "lawflow-evidence"

# Cloudflare Workers AI Binding (Optional for serverless LLM)
# [ai]
# binding = "AI"
